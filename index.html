<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0D254C">
  <title>G-Smart UPPKB Guyangan</title>
  <link rel="stylesheet" href="./styles-v2.css">
</head>
<body>
  <section id="loginView" class="login-shell">
    <div class="login-card">
      <div class="brand">
        <div class="logo">G</div>
        <div>
          <h1>G-Smart</h1>
          <p>UPPKB Guyangan · ETLE Monitoring</p>
        </div>
      </div>
      <form id="loginForm">
        <label>Email<input id="email" type="email" autocomplete="username" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Masuk</button>
        <button type="button" id="demoBtn" class="secondary">Preview dengan data contoh</button>
        <p id="loginMessage"></p>
      </form>
    </div>
  </section>

  <section id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="side-brand">
        <div class="logo small">G</div>
        <div><b>G-Smart</b><span>UPPKB Guyangan</span></div>
      </div>
      <nav id="nav"></nav>
      <div class="side-footer">
        <div id="profile"></div>
        <button id="logoutBtn" class="ghost">Keluar</button>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <button id="menuBtn" class="icon-btn">☰</button>
        <div class="topbar-title"><h2 id="pageTitle">Dashboard</h2><p id="pageSub">Monitoring ETLE terintegrasi</p></div>
        <div class="topbar-actions">
          <select id="globalMonth" class="month-select" title="Filter bulan"></select>
          <span class="status">● <span id="syncState">Siap</span></span>
        </div>
      </header>
      <section id="content"></section>
    </main>
  </section>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <section id="detailModal" class="detail-modal">
      <header class="modal-header">
        <div><h3 id="modalTitle">Detail Perkara</h3><p id="modalSubtitle"></p></div>
        <button id="closeModal" class="icon-btn">✕</button>
      </header>
      <div id="modalBody" class="modal-body"></div>
    </section>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script type="module" src="./app-v2.js?v=20261002-5"></script>
  <script type="module" src="./analytics-drilldown.js?v=20261002-1"></script>
  <script type="module" src="./court-enhancement.js?v=20261002-1"></script>
</body>
</html>
