name: G-Smart ETLE Web Push (Otomatis)
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'run (ETLE normal) atau ping (satu pesan ke PWA utama)'
        type: choice
        options:
          - run
          - ping
        required: true
        default: run
permissions:
  contents: read
concurrency:
  group: gsmart-web-push-production
  cancel-in-progress: false
jobs:
  send-push:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect ETLE changes and deliver FCM to subscribed G-Smart accounts
        env:
          SUPABASE_URL: https://pszyqzzqlzdgeefivydz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUSH_MODE: ${{ inputs.mode || 'run' }}
        run: node scripts/push-production.mjs
# Strictly server-side job, no Firebase Auth/browser SW modifications.
