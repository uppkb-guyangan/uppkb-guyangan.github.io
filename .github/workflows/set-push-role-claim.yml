name: Set Firebase Push Role Claim

on:
  workflow_dispatch:
    inputs:
      firebase_uid:
        description: "Firebase UID user"
        required: true
        type: string
      role:
        description: "Role push notification"
        required: true
        default: "ADMIN"
        type: choice
        options:
          - ADMIN
          - WASATPEL

permissions:
  contents: read

jobs:
  set-claim:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase Admin
        run: npm install --no-save firebase-admin@12

      - name: Set Firebase custom claim
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_UID: ${{ inputs.firebase_uid }}
          FIREBASE_ROLE: ${{ inputs.role }}
        run: node scripts/set-push-role-claim.cjs
