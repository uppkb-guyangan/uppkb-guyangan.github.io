name: Restore Firebase Supabase Access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-auth-claim:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase Admin
        run: npm install --no-save firebase-admin@12

      - name: Restore authenticated claim for Supabase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/set-push-role-claim.cjs
