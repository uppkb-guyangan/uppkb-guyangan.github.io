name: Firebase User Provisioning

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/firebase-user-provisioning.yml"
      - "scripts/provision-firebase-users.cjs"

permissions:
  contents: read

jobs:
  provision-authenticated-claim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Firebase Admin SDK
        run: npm install firebase-admin --no-save

      - name: Provision Firebase users
        run: node scripts/provision-firebase-users.cjs
